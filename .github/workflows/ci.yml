name: CI

on:
  push:
    branches:
      - "v*"
      - "develop/*"
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - "v*"
      - "develop/*"

jobs:
  build-and-test:
    name: Run build with unit test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
            node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Lint code
        run: npm run lint
      - name: Build project
        run: npm run build
      - name: Unit test
        run: npm run test:unit
      - name: Upload coverage report to Github
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: coverage
      - name: Upload coverage report to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          flag-name: coverage-report-${{ matrix.node-version }}
          parallel: true

  coverage-finished:
    name: Publish coverage report to Coveralls
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          parallel-finished: true
          carryforward: "coverage-report-22.x,coverage-report-24.x,coverage-report-26.x"

  cypress:
    name: Run e2e tests with Cypress
    runs-on: ubuntu-latest
    needs: build-and-test
    container:
      image: cypress/browsers:node-24.12.0-chrome-143.0.7499.169-1-ff-146.0.1-edge-143.0.3650.96-1
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: npm install
      - name: Build project
        run: npm run build
      - name: Cypress run
        uses: cypress-io/github-action@09090944bd8aaa2a517cefb6e38bf1aae336b42b
        with:
          browser: chrome

  analyze:
    name: Analyze code with CodeQL
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  sonarcloud:
    name: Analyze code with SonarQube
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: |
            **
          files_ignore: |
            package.json
            .npmrc
            **/*.md
            .github/**
            .gitignore
          
      - name: Check if code changes exist
        id: check-changes
        run: |
          if [ "${{ steps.changed-files.outputs.any_changed }}" == "true" ]; then
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
            echo "📝 Code changes detected in:"
            echo "${{ steps.changed-files.outputs.all_changed_files }}"
          else
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
            echo "📦 Only dependency, documentation or CI/CD files changed"
          fi

      - name: Download coverage artifact
        if: steps.check-changes.outputs.has_code_changes == 'true'
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-26.x
          path: coverage

      - name: SonarQube Scan
        if: steps.check-changes.outputs.has_code_changes == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}